services:
  postgres:
    image: postgres:16-alpine
    container_name: devtrust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devtrust-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: devtrust-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: devtrust-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/platform
      - AUTH_SECRET=your-secret-key-change-in-production
      - AUTH_URL=http://localhost:3000
      - AUTH_DOMAIN=.localhost
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_CONSOLE_PORT=9001
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
      - REDIS_URL=redis://redis:6379
      - RESEND_API_KEY=re_123456789
      - STRIPE_SECRET_KEY=sk_test_...
      - STRIPE_PUBLISHABLE_KEY=pk_test_...
      - STRIPE_WEBHOOK_SECRET=whsec_...
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - devtrust-network

  crm:
    build:
      context: .
      dockerfile: apps/crm/Dockerfile
    container_name: devtrust-crm
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - devtrust-network

networks:
  devtrust-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
